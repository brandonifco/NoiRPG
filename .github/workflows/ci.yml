name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when a new commit lands on the same PR. Agents should
# never wait on evidence that no longer applies.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          # Single source of truth for the SDK version.
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        id: restore
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        id: test
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Format check
        id: format
        if: always()
        run: dotnet format --verify-no-changes --no-restore

      # Deterministic scenario gate. The `scenario` route (tools/route.sh) is
      # CI-only precisely because tools/case_validator.py mechanically enforces
      # the case schema, the Three Doors rule, the junction budget, and the
      # canonical skill list — so that validator must actually RUN in the
      # required job, not merely be pointed at. Runs regardless of earlier
      # failures (if: always()) and hard-fails the job on any FAIL, so a
      # malformed case can never merge behind a green build-and-test.
      - name: Install Python (case validator)
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate case data
        id: cases
        if: always()
        run: |
          python3 -m pip install --quiet pyyaml
          shopt -s nullglob
          files=(cases/*.yaml cases/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No case files to validate."
            exit 0
          fi
          rc=0
          for f in "${files[@]}"; do
            echo "== $f =="
            python3 tools/case_validator.py "$f" || rc=1
          done
          exit "$rc"

      # The summary is the point of this workflow. It exists so an agent can decide
      # its next action from tens of lines instead of thousands. It is deliberately
      # not a second copy of the log.
      - name: Job summary
        if: always()
        run: python3 .github/workflows/summarize.py
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
