name: pr-policy

# Make the PR machine-readable: validate that the body carries real evidence
# (not the template's prompts), derive the verification route, and publish a
# small STATIC-metadata evidence artifact the orchestrator can read. Dynamic
# verification state (did each gate pass for this SHA) is owned solely by
# tools/agent-verify.sh, not this job.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR and emit evidence
        run: python3 .github/workflows/pr_policy.py --out evidence.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-evidence
          path: evidence.json
          retention-days: 30
